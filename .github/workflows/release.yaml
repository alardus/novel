name: Publish GitHub Package

on:
  push:
    tags:
      - "novel-v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and publish @alardus/novel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.5.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@alardus"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @alardus/novel typecheck

      - name: Lint
        run: pnpm --filter @alardus/novel lint

      - name: Build
        run: pnpm --filter @alardus/novel build

      - name: Verify release tag
        if: github.event_name == 'push'
        run: |
          package_version="$(node -p "require('./packages/headless/package.json').version")"
          expected_tag="novel-v${package_version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Expected tag ${expected_tag}, got ${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Publish
        run: pnpm --filter @alardus/novel publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
